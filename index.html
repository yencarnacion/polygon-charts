<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Candlestick + Signals Viewer</title>
  <!-- Bootstrap & Flatpickr -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
  <!-- Tabulator CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet"/>
  <style>
    body { margin:1rem; background:#121212; color:#e0e0e0 }
    #chart { width: 100%; height:600px; box-sizing: border-box; position: relative; }
    .form-control, .form-select {
      background:#1e1e1e!important;
      color:#e0e0e0!important;
      border:1px solid #444!important;
    }
    /* ─── Grid / Sheet Styling ─────────────────────────────── */
    #sheet, #news-sheet, #filings-sheet { margin-top:1rem; max-width:100%; overflow-x:auto; }
    /* Header container */
    #sheet .tabulator-header, #news-sheet .tabulator-header, #filings-sheet .tabulator-header {
      background:#000000; /* solid black header bar */
    }
    /* Individual header cells */
    #sheet .tabulator-col, #news-sheet .tabulator-col, #filings-sheet .tabulator-col {
      background:#000000; /* ensure every header cell is black */
    }
    /* Header title text */
    #sheet .tabulator-col-title, #news-sheet .tabulator-col-title, #filings-sheet .tabulator-col-title {
      color:#ffffff!important; /* bold white text */
      font-weight:bold;
      overflow:hidden; /* keep a single‑line ellipsis */
      text-overflow:ellipsis;
      white-space:nowrap;
      user-select:text;
    }
    #sheet .tabulator-tableholder, #news-sheet .tabulator-tableholder, #filings-sheet .tabulator-tableholder{
      background:#1e1e1e;
      color:#e0e0e0;
    }
    #sheet .tabulator-cell, #news-sheet .tabulator-cell, #filings-sheet .tabulator-cell{
      background:#2a2a2a;
      color:#ffffff;
      user-select:text;
    }
    /* ── Sheet header text ── */
    #sheet .tabulator-col-title{
      color:#ffffff !important; /* black TICKER, TIME, SIGNAL… */
    }
    /* ── Sheet body cell text ── */
    #sheet .tabulator-cell{
      color:#ffffff !important;
    }
    #sheet .tabulator-row-even, #news-sheet .tabulator-row-even, #filings-sheet .tabulator-row-even {background-color:#252525;}
    #sheet .tabulator-row-odd, #news-sheet .tabulator-row-odd, #filings-sheet .tabulator-row-odd {background-color:#2a2a2a;}
    /* --- Tabulator header tooltip (hover popup) --- */
    .tabulator-tooltip{
      background:#000 !important; /* black background */
      color:#fff !important; /* bold white text */
      font-weight:bold; /* make text bold */
      z-index: 9999;
      max-width: 600px;
      white-space: pre-line;
      word-break: break-all;
    }
    /* --- Editing input styling for readability --- */
    .tabulator-editing input,
    .tabulator-editing textarea,
    .tabulator-editing select {
      background-color: #ffffff !important; /* White background for edit mode */
      color: #000000 !important; /* Black text for readability */
      border: 1px solid #cccccc !important; /* Light border */
    }
    /* ─── Row Indicator Styling ────────────────────────────── */
    #row-indicator {
      position: absolute;
      top: 100px; /* Adjust based on your header height; above the chart */
      right: 20px;
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;
      background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent black for visibility */
      padding: 5px 10px;
      border-radius: 5px;
      z-index: 1000; /* Ensure it's on top */
    }
    .tabulator-cell a {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
    }
    .profile-container {
      background: #1e1e1e;
      border: 1px solid #444;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 2rem;
    }
    .profile-container h4 {
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .profile-container h5 {
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .profile-container p {
      margin-bottom: 0.5rem;
    }
    .profile-container p strong {
      color: #cccccc;
    }
    .profile-container a {
      color: #4da6ff;
      text-decoration: underline;
    }
    .profile-container a:hover {
      color: #80bfff;
    }
    .profile-container img {
      max-width: 100px;
      margin-bottom: 1rem;
      border-radius: 4px;
    }
    /* Improved hover for readability */
    .tabulator-row:hover .tabulator-cell {
      background-color: #3a3a3a !important;
      color: #ffffff !important;
    }
    .tabulator-col:hover {
      background-color: #111111 !important;
    }
    .tabulator-row:hover {
      background-color: #3a3a3a !important;
    }
    /* 09:30 vertical guide */
    .rth-line {
      position:absolute; top:0; bottom:0; width:0;
      border-left:2px dashed #ffd700; pointer-events:none; opacity:0.9; z-index:2;
    }
    .rth-label {
      position:absolute; top:0; transform: translateX(-50%);
      font-size:12px; background:rgba(0,0,0,0.6);
      padding:2px 4px; border-radius:3px; color:#ffd700; z-index:2;
    }
  </style>
</head>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
// Updated to fix table population issues
const patternfolioURL = "{{PATTERNFOLIO_URL}}";
let currentNews = [];
let currentFilings = [];
let listenersAdded = false;
let isCsvUploaded = false; // Flag to track if CSV was uploaded

const nyTime = ts =>
  new Date(ts * 1000).toLocaleTimeString(
    'en-US',
    { timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute: '2-digit' }
  );

/* ─── Date picker with current NY date default ───────────── */
const nyFormatter = new Intl.DateTimeFormat('en-CA',{
  timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
const currentNyDate = nyFormatter.format(new Date());
flatpickr('#tradeDate',{dateFormat:'Y-m-d',defaultDate:currentNyDate});
const nyTimeFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: 'America/New_York',
  hour: 'numeric',
  minute: 'numeric',
  hour12: false
});
const NY_TZ = 'America/New_York';
function tzOffsetFor(epochMillis, timeZone = NY_TZ) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  const parts = dtf.formatToParts(new Date(epochMillis));
  const map = {};
  for (const p of parts) map[p.type] = p.value;
  const asUTC = Date.UTC(+map.year, +map.month - 1, +map.day, +map.hour, +map.minute, +map.second);
  return (asUTC - epochMillis) / 60000;
}
function getNyTime(dateStr, h, m) {
  const [Y, M, D] = dateStr.split('-').map(Number);
  const utcGuess = Date.UTC(Y, M - 1, D, h, m, 0);
  const off1 = tzOffsetFor(utcGuess, NY_TZ);
  let epoch = utcGuess - off1 * 60000;
  const off2 = tzOffsetFor(epoch, NY_TZ);
  if (off2 !== off1) epoch = utcGuess - off2 * 60000;
  return new Date(epoch);
}
const nyHMFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: NY_TZ, hour12: false, hour: '2-digit', minute: '2-digit'
});
function nyHourMinute(epochMillis) {
  const parts = nyHMFormatter.formatToParts(new Date(epochMillis));
  let hh = 0, mm = 0;
  for (const p of parts) {
    if (p.type === 'hour') hh = Number(p.value);
    else if (p.type === 'minute') mm = Number(p.value);
  }
  return [hh, mm];
}

// Place a vertical dashed line + label at 09:30 NY on a lightweight-charts chart
function drawRthOpenLine(chart, containerEl, dateStr) {
  let line = containerEl.querySelector('.rth-line');
  let label = containerEl.querySelector('.rth-label');
  if (!line) {
    line = document.createElement('div'); line.className = 'rth-line';
    label = document.createElement('div'); label.className = 'rth-label'; label.textContent = '09:30';
    containerEl.appendChild(line); containerEl.appendChild(label);
  }

  chart.__rthTarget = getNyTime(dateStr, 9, 30).getTime() / 1000;

  if (!chart.__rthHandler) {
    chart.__rthHandler = () => {
      const x = chart.timeScale().timeToCoordinate(chart.__rthTarget);
      if (x == null) {
        line.style.display = 'none';
        label.style.display = 'none';
        return;
      }
      line.style.display = 'block';
      label.style.display = 'block';
      const px = Math.round(x);
      line.style.left = px + 'px';
      label.style.left = px + 'px';
    };
    chart.timeScale().subscribeVisibleTimeRangeChange(chart.__rthHandler);
    window.addEventListener('resize', chart.__rthHandler);
  }
  chart.__rthHandler();
}

/* ─── Chart setup ─────────────────────────────────────────── */
const chart = LightweightCharts.createChart(document.getElementById('chart'),{
  layout:{background:{color:'#1e1e1e'},textColor:'#cccccc'},
  grid:{vertLines:{color:'#2e2e2e'},horzLines:{color:'#2e2e2e'}},
  timeScale:{timeVisible:true,secondsVisible:false},
  localization:{ timeFormatter: nyTime } // ★ cross‑hair label
});
chart.timeScale().applyOptions({ tickMarkFormatter: nyTime }); // ★ axis ticks

const candleSeries = chart.addCandlestickSeries({
  upColor:'#26a69a',downColor:'#ef5350',
  wickUpColor:'#26a69a',wickDownColor:'#ef5350',borderVisible:false});
const volumeSeries = chart.addHistogramSeries({
  color:'#888',priceFormat:{type:'volume'},
  priceScaleId:'vol',scaleMargins:{top:0.75,bottom:0}});
chart.priceScale('right').applyOptions({scaleMargins:{top:0.05,bottom:0.35}});
chart.priceScale('vol').applyOptions({scaleMargins:{top:0.75,bottom:0}});
const vwapSeries = chart.addLineSeries({color:'#ffd700',lineWidth:2});
const smaSeries = chart.addLineSeries({color:'#ff4444',lineWidth:2});

/* ─── Global data storage ────────────────────────────────── */
let cachedCandles = [];
let cachedVolume = [];
let cachedMinCandles = [];
let cachedMinVolume = [];
let priorDayCloses = {}; // Store prior‑day closes
let priorDayVolumes = {}; // New: Store prior-day RTH volumes
let priorDayDates = {};

/* ─── Load candles with debug logging ────────────────────── */
async function load(e, skipDefaultRow = false){
  if(e) e.preventDefault();
  const ticker = document.getElementById('ticker').value.trim();
  const timeframe= document.getElementById('timeframe').value;
  const date = document.getElementById('tradeDate').value;
  console.debug('[load] requesting',{ticker,timeframe,date});
  if(!ticker||!timeframe||!date){alert('Fill all fields');return;}
  try{
    const {data}=await axios.get('/api/candles',{params:{ticker,timeframe,date}});
    console.debug('[load] received',data.candles.length,'bars');
    if(!data.candles.length){
      console.warn('[load] no candles',ticker,date,timeframe);
      alert('No RTH data for this date; try the prior trading day.');
    }
    await fetchPriorDayClose(ticker,date);
    // Determine multMin for aggregation
    let multMin;
    switch(timeframe) {
      case '1m': multMin = 1; break;
      case '2m': multMin = 2; break;
      case '3m': multMin = 3; break;
      case '5m': multMin = 5; break;
      case '10m': multMin = 10; break;
      case '15m': multMin = 15; break;
      case '30m': multMin = 30; break;
      case '1h': multMin = 60; break;
      default: multMin = 1;
    }
    // Extend minCandles and minVolume to 16:00 if necessary
    if (data.minCandles.length > 0) {
      let lastTime = data.minCandles[data.minCandles.length - 1].time;
      let lastClose = data.minCandles[data.minCandles.length - 1].close;
      let nextTime = lastTime + 60;
      const endTime = getNyTime(date, 16, 0).getTime() / 1000;
      while (nextTime < endTime) {
        data.minCandles.push({time: nextTime, open: lastClose, high: lastClose, low: lastClose, close: lastClose});
        data.minVolume.push({time: nextTime, value: 0});
        nextTime += 60;
      }
    } else {
      data.minCandles = [];
      data.minVolume = [];
    }
    // Recompute VWAP
    let cumPV = 0;
    let cumV = 0;
    data.vwap = [];
    for (let i = 0; i < data.minCandles.length; i++) {
      const c = data.minCandles[i];
      const v = data.minVolume[i].value;
      const typ = (c.high + c.low + c.close) / 3;
      cumPV += typ * v;
      cumV += v;
      if (cumV > 0) {
        data.vwap.push({time: c.time, value: cumPV / cumV});
      } else if (data.vwap.length > 0) {
        data.vwap.push({time: c.time, value: data.vwap[data.vwap.length - 1].value});
      }
    }
    // Aggregate to timeframe using extended min data
    const aggCandles = [];
    const aggVolume = [];
    for (let i = 0; i < data.minCandles.length; i += multMin) {
      const end = Math.min(i + multMin, data.minCandles.length);
      const group = data.minCandles.slice(i, end);
      if (group.length === 0) break;
      const o = group[0].open;
      let h = group[0].high;
      let l = group[0].low;
      for (const g of group) {
        if (g.high > h) h = g.high;
        if (g.low < l) l = g.low;
      }
      const c = group[group.length - 1].close;
      let v = 0;
      for (let j = i; j < end; j++) {
        v += data.minVolume[j].value;
      }
      aggCandles.push({time: group[0].time, open: o, high: h, low: l, close: c});
      aggVolume.push({time: group[0].time, value: v});
    }
    data.candles = aggCandles;
    data.volume = aggVolume;
    // Recompute SMA-9
    let sum = 0;
    data.sma = [];
    for (let i = 0; i < data.candles.length; i++) {
      sum += data.candles[i].close;
      if (i >= 9) {
        sum -= data.candles[i - 9].close;
      }
      if (i >= 8) {
        data.sma.push({time: data.candles[i].time, value: sum / 9});
      }
    }
    /* Cache */
    cachedCandles=data.candles;cachedVolume=data.volume;
    cachedMinCandles=data.minCandles;cachedMinVolume=data.minVolume;
    candleSeries.setData(data.candles);
    volumeSeries.setData(data.volume);
    vwapSeries.setData(data.vwap);
    smaSeries.setData(data.sma);
    candleSeries.setMarkers([]);
    chart.timeScale().fitContent();
    drawRthOpenLine(chart, document.getElementById('chart'), date);
    await displayExtra(ticker, date);
    if (csvData.length === 1 && csvData[0].ticker.toUpperCase() !== ticker.toUpperCase() && !isCsvUploaded) {
      csvData = [];
      table.setData([]);
    }
    if (csvData.length === 0 && !skipDefaultRow) {
      if (cachedMinCandles.length === 0) {
        // No candle data available, do not create default row or show chart
        candleSeries.setData([]);
        volumeSeries.setData([]);
        vwapSeries.setData([]);
        smaSeries.setData([]);
        return;
      }
      const row = { ticker: ticker.toUpperCase(), time: '0930', signal: 'buy' };
      NEW_COLUMNS.forEach(col => row[col] = '');
      await calculateMetricsForRow(row);
      csvData = [{__row: 0, ...row}];
      const allFields = ['ticker', 'time', 'signal', ...NEW_COLUMNS];
      const cols = allFields.map(h => ({
        title: h.toUpperCase().replace(/_/g, ' '),
        field: h,
        editor: "input",
        minWidth: 80,
        headerSort: false,
        headerTooltip: true
      }));
      cols.unshift({ title: "#", formatter: "rownum", hozAlign: "center", width: 40, frozen: true });
      table.setColumns(cols);
      table.setData(csvData).then(() => {
        currentRow = 0;
        updateTableView();
        showSignalOnChart(csvData[currentRow]);
      });
    }
  }catch(err){
    console.error('[load] error',err);
    alert('Error: '+(err.response?.data||err));
  }
}

/* ─── Fetch prior‑day close (handles holidays/weekends) ─── */
async function fetchPriorDayClose(ticker,date){
  const key = ticker.toUpperCase(); // *** NEW: normalise once ***
  if(priorDayCloses[key]) return; // cached
  let d = new Date(date);
  d.setDate(d.getDate() - 1);
  const to_date = d.toISOString().split('T')[0];
  d.setDate(d.getDate() - 30);
  const from_date = d.toISOString().split('T')[0];
  console.debug('[priorDay] fetching',key,from_date,to_date);
  try{
    const {data}=await axios.get('/api/candles',
      {params:{ticker: key,timeframe:'1d',from:from_date,to:to_date}});
    if(data.candles&&data.candles.length>0){
      const last=data.candles[data.candles.length-1];
      priorDayCloses[key]=last.close;
      console.debug('[priorDay] close',key,last.close);
      // New: Prior day volume (RTH cumulative)
      const priorVol = data.volume[data.volume.length-1].value;
      priorDayVolumes[key] = priorVol;
      const prior_date = new Date(last.time * 1000).toISOString().split('T')[0];
      priorDayDates[key] = prior_date;
      return;
    }else{console.warn('[priorDay] no candles',from_date,to_date);}
  }catch(err){console.warn('[priorDay] error',err);}
  console.error('[priorDay] could not find close');
}

document.getElementById('form').addEventListener('submit',load);
load(); // initial

/* ─── Tabulator grid & navigation ─────────────────────────── */
let table,csvData=[],currentRow=0;

/* New columns that get added to CSV rows */
const NEW_COLUMNS=[
  'market_cap','float','open_price','close_price','high_of_day','low_of_day',
  'percent_gain_eod','max_spiking_up_percent','max_spiking_down_percent',
  'volume','percent_gap_from_prior', 'prior_day_volume', 'pre_market_volume'];

/* Update table view to show only current row */
function updateTableView(){
  table.setFilter("__row","=",currentRow);
  table.getColumns().forEach(col=>{
    const field=col.getField();
    if(field==="__row"){col.hide();return;}
    col.show();
  });
  // Update row indicator
  document.getElementById('row-indicator').textContent = `${currentRow + 1}/${csvData.length}`;
}

/* ─── Tooltip only for truncated cell values ──────────────── */
function truncatedTooltip(cell){
  // If cell element exists, and the content is overflowed (truncated), show full value as tooltip
  const el = cell.getElement();
  const textEl = el.querySelector('a') || el;
  if (textEl && (textEl.scrollWidth > textEl.clientWidth || textEl.scrollHeight > textEl.clientHeight)) {
    return cell.getValue();
  }
  return false; // No tooltip unless overflow
}

/* Build blank Tabulator instance */
function setupTable(){
  table=new Tabulator("#sheet",{
    data:[],
    index:"__row",
    layout:"fitColumns",
    headerWordWrap:true,
    tooltipsHeader:true, // header tooltips as before
    tooltips: truncatedTooltip, // <-- enable tooltips only if truncated
    columns:[],
    cellEdited:cell=>{
      const rowIdx=cell.getRow().getData().__row;
      const field =cell.getField();
      const value =cell.getValue();
      csvData[rowIdx][field]=value;
      console.debug('[edit]',rowIdx,field,value);
    },
  });
}

setupTable();

/* ─── Fetch extended hours data for pre/after market ────── */
async function fetchExtendedData(ticker, date){
  console.debug('[extended] fetching for', ticker, date);
  try {
    const {data} = await axios.get('/api/candles', {
      params: {ticker, timeframe: '1m', date, extended: 'true'}
    });
    return data.minVolume; // Returns all 1m bars (pre, RTH, after)
  } catch (err) {
    console.error('[extended] error', err);
    return [];
  }
}

/* ─── Calculate pre-market volume ────────────────────────── */
async function calculatePreMarketVolume(ticker, currentDate, priorDate){
  const priorExtVol = await fetchExtendedData(ticker, priorDate);
  const priorAfterHours = priorExtVol
    .filter(v => { const [hour] = nyHourMinute(v.time * 1000); return hour >= 16 && hour < 20; })
    .reduce((sum, v) => sum + v.value, 0);
  const currExtVol = await fetchExtendedData(ticker, currentDate);
  const currPreMarket = currExtVol
    .filter(v => { const [hour, min] = nyHourMinute(v.time * 1000); return (hour >= 4 && hour < 9) || (hour === 9 && min < 30); })
    .reduce((sum, v) => sum + v.value, 0);
  return priorAfterHours + currPreMarket;
}

/* ─── Format number with suffixes ────────────────────────── */
function formatNumber(num, isMarketCap = false) {
  if (num < 1000) return (isMarketCap ? '$' : '') + num.toFixed(1);
  if (num < 1000000) return (isMarketCap ? '$' : '') + (num / 1000).toFixed(1) + ' K';
  if (num < 100000000) return (isMarketCap ? '$' : '') + (num / 1000000).toFixed(1) + ' M';
  if (num < 1000000000) return (isMarketCap ? '$' : '') + (num / 1000000).toLocaleString('en-US', {maximumFractionDigits: 1}) + ' M';
  if (num < 100000000000) return (isMarketCap ? '$' : '') + (num / 1000000000).toFixed(1) + ' B';
  return (isMarketCap ? '$' : '') + (num / 1000000000).toLocaleString('en-US', {maximumFractionDigits: 1}) + ' B';
}

/* ─── Fetch and format market cap from Polygon ────────────── */
async function fetchMarketCap(ticker) {
  try {
    const {data} = await axios.get('/api/ticker-details', {params: {ticker}});
    const marketCap = data.results.market_cap || 0;
    return formatNumber(marketCap, true);
  } catch (err) {
    console.error('[marketCap] error for', ticker, err);
    return 'na'; // Fallback
  }
}

/* ─── Fetch and format float from FMP ─────────────────────── */
async function fetchFloat(ticker) {
  try {
    const {data} = await axios.get('/api/share-float', {params: {ticker}});
    const floatShares = data[0]?.floatShares || 0;
    return formatNumber(floatShares);
  } catch (err) {
    console.error('[float] error for', ticker, err);
    return 'na'; // Fallback
  }
}

/* ─── Calculate metrics for a CSV row (async for fetches) ── */
async function calculateMetricsForRow(row){
  if(!cachedMinCandles.length) return;
  const rowTime=row.time;
  if(!rowTime) return;
  const relevant = cachedMinCandles;
  if(relevant.length > 0) {
    const openPrice=relevant[0].open;
    const eodClose=relevant[relevant.length-1].close;
    const highOfDay=Math.max(...relevant.map(c=>c.high));
    const lowOfDay =Math.min(...relevant.map(c=>c.low));
    row.open_price = openPrice.toFixed(2);
    row.close_price = eodClose.toFixed(2);
    row.high_of_day = highOfDay.toFixed(2);
    row.low_of_day = lowOfDay.toFixed(2);
    if(openPrice>0){
      let gain = ((eodClose - openPrice) / openPrice * 100).toFixed(2);
      if (row.signal.toLowerCase() === 'sell') {
        gain = ((openPrice - eodClose) / openPrice * 100).toFixed(2);
      }
      row.percent_gain_eod = gain;
      row.max_spiking_up_percent = ((highOfDay-openPrice)/openPrice*100).toFixed(2);
      row.max_spiking_down_percent = ((openPrice - lowOfDay)/openPrice*100).toFixed(2);
    }
    if(cachedMinVolume.length){
      const relevantVolume = cachedMinVolume;
      const totalVol = relevantVolume.reduce((s, v) => s + v.value, 0);
      row.volume = Math.round(totalVol).toLocaleString();
    }
    const ticker=row.ticker.toUpperCase();
    if(priorDayCloses[ticker]){
      const prior=priorDayCloses[ticker];
      row.percent_gap_from_prior = ((openPrice-prior)/prior*100).toFixed(2);
    }
    // New: Prior day volume (RTH cumulative)
    if(priorDayVolumes[ticker]){
      row.prior_day_volume = Math.round(priorDayVolumes[ticker]).toLocaleString();
    }
    // New: Pre-market volume (prior after + current pre)
    const priorDate = priorDayDates[ticker] || '';
    let preVol = 0;
    if(priorDate){
      const currentDate = document.getElementById('tradeDate').value;
      preVol = await calculatePreMarketVolume(ticker, currentDate, priorDate);
    }
    row.pre_market_volume = Math.round(preVol).toLocaleString();
    // New: Market Cap from Polygon
    row.market_cap = await fetchMarketCap(ticker);
    // New: Float from FMP
    row.float = await fetchFloat(ticker);
  }
}

/* ─── CSV upload handler ─────────────────────────────────── */
document.getElementById('csvFile').addEventListener('change',async e=>{
  isCsvUploaded = true;
  const file=e.target.files[0]; if(!file) return;
  const text=await file.text();
  const p=Papa.parse(text.trim(),{header:true,skipEmptyLines:true});
  csvData=p.data.map((r,i)=>({__row:i,...r}));
  if(!csvData.length){alert("CSV seems empty");return;}
  csvData.forEach(row=>{
    NEW_COLUMNS.forEach(col=>{if(!(col in row)) row[col]="";});
  });
  const allFields=[...new Set([...p.meta.fields,...NEW_COLUMNS])];
  const cols=allFields.map(h=>({
    title:h.toUpperCase().replace(/_/g,' '),
    field:h,
    editor:"input",
    minWidth:80,
    headerSort:false,
    headerTooltip:true // column‑specific tooltip (redundant but safe)
  }));
  cols.unshift({
    title:"#",formatter:"rownum",hozAlign:"center",width:40,frozen:true
  });
  table.setColumns(cols);
  table.setData(csvData).then(()=>{
    currentRow=0;
    console.debug('[CSV] loaded',csvData.length,'rows');
    updateTableView();
    console.debug('[CSV] showing row',currentRow,csvData[currentRow]);
    showSignalOnChart(csvData[currentRow]);
  });
});

/* ─── Add Column ─────────────────────────────────────────── */
document.getElementById('addColumn').onclick=()=>{
  const name=document.getElementById('newColumn').value.trim();
  if(!name) return;
  csvData.forEach(r=>r[name]="");
  table.addColumn({title:name,field:name,editor:"input",headerTooltip:true});
  document.getElementById('newColumn').value="";
};

/* ─── Prev / Next navigation ─────────────────────────────── */
document.getElementById('prevRow').onclick=()=>{
  if(currentRow>0){
    currentRow--;
    console.debug('[nav] prev →',currentRow,csvData[currentRow]);
    updateTableView(); showSignalOnChart(csvData[currentRow]);
  }
};

document.getElementById('nextRow').onclick=()=>{
  if(currentRow<csvData.length-1){
    currentRow++;
    console.debug('[nav] next →',currentRow,csvData[currentRow]);
    updateTableView(); showSignalOnChart(csvData[currentRow]);

/* ─── Show signal on chart ───────────────────────────────── */
function combineDateAndTime(dateStr,HHMM){
  const s = String(HHMM).replace(':','').padStart(4,'0');
  const h = parseInt(s.slice(0,2),10), m = parseInt(s.slice(2,4),10);
  return getNyTime(dateStr,h,m).getTime();
}

async function showSignalOnChart(row){
  console.debug('[show] row →',row);
  const currentTicker = document.getElementById('ticker').value.toUpperCase();
  if (row.ticker.toUpperCase() !== currentTicker) {
    document.getElementById('ticker').value = row.ticker.toUpperCase();
    await load(null, true); // Load with skipDefaultRow = true to avoid recursion
  }
  await calculateMetricsForRow(row); // enrich row metrics (async)
  table.updateData([row]); // show updates in grid
  const hhmm = String(row.time).replace(':','').padStart(4,'0');
  const ts = combineDateAndTime(document.getElementById('tradeDate').value, hhmm);
  const isBuy = row.signal.toLowerCase() === "buy";
  if (hhmm === '0930') {
    candleSeries.setMarkers([]);
  } else {
    candleSeries.setMarkers([{
      time:ts/1000,
      position:isBuy?"belowBar":"aboveBar",
      shape:isBuy?"arrowUp":"arrowDown",
      color:isBuy?"#00ff00":"#ff3333",
      size:2
    }]);
  }
}

/* ─── Export CSV ─────────────────────────────────────────── */
document.getElementById('downloadCsv').onclick=()=>{
  if(!csvData.length) return;
  const out=csvData.map(({__row,...r})=>r);
  const csv=Papa.unparse(out);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="signals_edited.csv";
  a.click();
};

      return;

      ticker: document.getElementById('ticker').value,
      news: currentNews.map(item => ({
        published: item.published,
        title: item.title,
        source: item.source,
        url: item.url
      }))
    };
    navigator.clipboard.writeText(JSON.stringify(jsonData, null, 2)).then(() => {
      alert('News JSON copied to clipboard!');
    }).catch(err => {
      console.error('Failed to copy: ', err);
      alert('Failed to copy to clipboard.');

document.getElementById('toggleSignal').addEventListener('click', () => {
  if (csvData.length === 0) return;
  const row = csvData[currentRow];
  row.signal = row.signal.toLowerCase() === 'buy' ? 'sell' : 'buy';
  calculateMetricsForRow(row).then(() => {
    table.updateData([row]);
    showSignalOnChart(row);
  });
});

document.getElementById('postToPatternfolio').addEventListener('click', async () => {
  if (csvData.length === 0) {
    alert('No chart loaded');
    return;
  }
  const row = csvData[currentRow];
  const note = prompt('Optional note:') || '';
  try {
    await axios.post(patternfolioURL + '/api/incoming', {
      ticker: row.ticker,
      date: document.getElementById('tradeDate').value,
      signalTime: row.time,
      note: note
    });
    alert('Chart posted to Patternfolio!');
  } catch (err) {
    alert('Error posting: ' + (err.response?.data || err.message));
  }
});
