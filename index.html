<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Candlestick Viewer – Dark Mode + Volume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        body { margin: 1rem; background: #121212; color: #e0e0e0 }
        #chart { height: 600px }
        .form-control, .form-select { background: #1e1e1e !important; color: #e0e0e0 !important; border: 1px solid #444 !important }
    </style>
</head>
<body>

<h3 class="mb-3">Candles + Volume (gray), VWAP (yellow) & SMA-9 (red)</h3>

<form id="form" class="row gy-2 gx-2 align-items-center">
    <div class="col-auto"><input id="ticker" class="form-control" value="SPY" placeholder="Ticker"></div>
    <div class="col-auto">
        <select id="timeframe" class="form-select">
            <option value="1m">1 m</option><option value="2m">2 m</option><option value="3m">3 m</option>
            <option value="5m" selected>5 m</option><option value="10m">10 m</option><option value="15m">15 m</option>
            <option value="30m">30 m</option><option value="1h">1 h</option>
        </select>
    </div>
    <div class="col-auto"><input id="date" class="form-control" placeholder="Date"></div>
    <div class="col-auto"><button class="btn btn-primary" type="submit">Load</button></div>
</form>

<div id="chart" class="border mt-4 rounded"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>

<script>
    flatpickr('#date', { dateFormat: 'Y-m-d', defaultDate: '2024-03-25' });

    /* -------- chart (dark) -------- */
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { background: { color: '#1e1e1e' }, textColor: '#cccccc', fontFamily: 'sans-serif' },
        grid: { vertLines: { color: '#2e2e2e' }, horzLines: { color: '#2e2e2e' } },
        timeScale: {
            timeVisible: true,
            secondsVisible: false,
            tickMarkFormatter: t => new Date(t * 1000).toLocaleTimeString(
                'en-US', { timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute: '2-digit' }
            )
        }
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350'
    });

    /* ---- volume histogram uses its own price scale ---- */
    const volumeSeries = chart.addHistogramSeries({
        color: '#888',
        priceFormat: { type: 'volume' },
        priceScaleId: 'vol',
        scaleMargins: { top: 0.75, bottom: 0 } // Bottom 25% of the chart
    });

    // Configure the 'right' price scale to confine the candlestick series to the top portion
    chart.priceScale('right').applyOptions({
        scaleMargins: {
            top: 0.05,  // Start 5% from the top
            bottom: 0.35 // End 35% from the bottom (i.e., 65% from the top)
        }
    });

    // Ensure the 'vol' price scale is properly positioned in the bottom portion
    chart.priceScale('vol').applyOptions({
        scaleMargins: {
            top: 0.75,  // Start 75% from the top
            bottom: 0   // Extend to the bottom
        }
    });

    const vwapSeries = chart.addLineSeries({ color: '#ffd700', lineWidth: 2 });
    const smaSeries = chart.addLineSeries({ color: '#ff4444', lineWidth: 2 });

    /* -------- data loader -------- */
    async function load(e) {
        e && e.preventDefault();
        const params = {
            ticker: document.getElementById('ticker').value.trim(),
            timeframe: document.getElementById('timeframe').value,
            date: document.getElementById('date').value
        };
        if (!params.ticker || !params.timeframe || !params.date) {
            alert('Fill all fields');
            return;
        }
        try {
            const { data } = await axios.get('/api/candles', { params });
            candleSeries.setData(data.candles);
            volumeSeries.setData(data.volume);
            vwapSeries.setData(data.vwap);
            smaSeries.setData(data.sma);
            chart.timeScale().fitContent();
        } catch (err) {
            alert('Error: ' + (err.response?.data || err));
        }
    }
    document.getElementById('form').addEventListener('submit', load);
    load();
</script>
</body>
</html>
