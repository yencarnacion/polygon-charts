<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Candlestick + Signals Viewer</title>
  <!-- Bootstrap & Flatpickr -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <!-- Tabulator CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b1220;
      --bg-bloom: rgba(39, 84, 141, 0.35);
      --surface: #121d2d;
      --surface-2: #1a273a;
      --surface-3: #22324a;
      --border: #314663;
      --text: #e9f1fb;
      --muted: #a8b9ce;
      --accent: #4fa7ff;
      --accent-strong: #2b7dcb;
      --positive: #21c58f;
      --negative: #ff8a5a;
      --warning: #ffd166;
      --neutral: #8ca0bc;
    }
    body {
      margin: 1rem;
      color: var(--text);
      font-family: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 5% 8%, var(--bg-bloom), transparent 34%),
        radial-gradient(circle at 88% 0%, rgba(31, 60, 105, 0.3), transparent 30%),
        var(--bg);
    }
    h3, h4, h5, p, label, strong { color: var(--text); }
    #chart {
      width: 100%;
      height: 600px;
      box-sizing: border-box;
      position: relative;
      border-color: var(--border) !important;
      background: var(--surface);
    }
    .form-control, .form-select {
      background: var(--surface) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
    }
    .form-control::placeholder { color: var(--muted) !important; }
    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #081421;
      font-weight: 700;
    }
    .btn-primary:hover { background-color: var(--accent-strong); border-color: var(--accent-strong); color: #f5f9ff; }
    .btn-secondary {
      background: #2a3950;
      border-color: #2a3950;
      color: var(--text);
    }
    .btn-outline-light { color: var(--text); border-color: var(--border); }
    .btn-outline-light:hover { background: var(--surface-2); border-color: var(--accent); color: var(--text); }
    #sheet, #news-sheet, #filings-sheet, #market-radar-leaders, #market-radar-intraday {
      margin-top: 1rem;
      max-width: 100%;
      overflow-x: auto;
    }
    .tabulator-header,
    .tabulator-col {
      background: var(--surface-3) !important;
      border-color: var(--border) !important;
    }
    .tabulator-col-title {
      color: var(--text) !important;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: text;
    }
    .tabulator-tableholder {
      background: var(--surface);
      color: var(--text);
    }
    .tabulator-cell {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border) !important;
      user-select: text;
    }
    .tabulator-row-even { background-color: #1a2739; }
    .tabulator-row-odd { background-color: #1c2a3d; }
    .tabulator-tooltip {
      background: #0a111c !important;
      color: #f3f8ff !important;
      z-index: 9999;
      max-width: 600px;
      white-space: pre-line;
      word-break: break-word;
    }
    .tabulator-editing input,
    .tabulator-editing textarea,
    .tabulator-editing select {
      background-color: #ffffff !important;
      color: #061322 !important;
      border: 1px solid #9eb3cc !important;
    }
    #row-indicator {
      position: absolute;
      top: 100px;
      right: 20px;
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      background-color: rgba(7, 14, 24, 0.82);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      z-index: 1000;
    }
    .tabulator-cell a {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
      color: #7ec1ff;
    }
    .profile-container {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 2rem;
    }
    .profile-container h4 { margin-bottom: 1rem; }
    .profile-container h5 { margin-bottom: 1rem; }
    .profile-container p { margin-bottom: 0.5rem; }
    .profile-container p strong { color: var(--muted); }
    .profile-container a {
      color: #84c6ff;
      text-decoration: underline;
    }
    .profile-container a:hover {
      color: #b4dbff;
    }
    .profile-container img {
      max-width: 100px;
      margin-bottom: 1rem;
      border-radius: 4px;
    }
    .tabulator-row:hover .tabulator-cell {
      background-color: #253955 !important;
      color: #f5f9ff !important;
    }
    .tabulator-col:hover { background-color: #2a3b55 !important; }
    .tabulator-row:hover { background-color: #253955 !important; }
    .market-radar {
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
    }
    .radar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .radar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      min-height: 86px;
    }
    .radar-card .label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .radar-card .value {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.05;
      margin-top: 0.3rem;
    }
    .radar-card .sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.2rem;
    }
    .radar-card.pos { border-left-color: var(--positive); }
    .radar-card.neg { border-left-color: var(--negative); }
    .radar-card.warn { border-left-color: var(--warning); }
    .radar-card.neu { border-left-color: var(--neutral); }
    .radar-updated { color: var(--muted); font-size: 0.82rem; }
    .chip-long { color: var(--positive); }
    .chip-short { color: var(--negative); }
    .chip-neutral { color: var(--neutral); }
    .rth-line {
      position:absolute; top:0; bottom:0; width:0;
      border-left:2px dashed var(--warning); pointer-events:none; opacity:0.9; z-index:2;
    }
    .rth-label {
      position:absolute; top:0; transform: translateX(-50%);
      font-size:12px; background:rgba(7,14,24,0.7);
      padding:2px 4px; border-radius:3px; color:var(--warning); z-index:2;
    }
  </style>
</head>
<body>
<h3 class="mb-3">Candles + Volume (slate), VWAP (yellow) & SMA-9 (blue)</h3>
<form id="form" class="row gy-2 gx-2 align-items-center">
  <div class="col-auto"><input id="ticker" class="form-control" value="SPY" placeholder="Ticker"></div>
  <div class="col-auto">
    <select id="timeframe" class="form-select">
      <option value="1m" selected>1 m</option><option value="2m">2 m</option><option value="3m">3 m</option>
      <option value="5m">5 m</option><option value="10m">10 m</option><option value="15m">15 m</option>
      <option value="30m">30 m</option><option value="1h">1 h</option>
    </select>
  </div>
  <div class="col-auto"><input id="tradeDate" class="form-control" placeholder="Date"></div>
  <div class="col-auto"><button class="btn btn-primary" type="submit">Load</button></div>
</form>
<div class="d-flex align-items-center gap-2 flex-wrap mt-3">
  <input id="csvFile" type="file" accept=".csv,text/csv" class="form-control" style="max-width:260px">
  <input id="newColumn" class="form-control" placeholder="New column name" style="max-width:200px">
  <button id="addColumn" class="btn btn-outline-success btn-sm">Add Column</button>
  <button id="prevRow" class="btn btn-outline-light btn-sm">▲ Prev</button>
  <button id="nextRow" class="btn btn-outline-light btn-sm">▼ Next</button>
  <button id="toggleSignal" class="btn btn-outline-light btn-sm">Toggle Signal</button>
  <button id="postToPatternfolio" class="btn btn-outline-light btn-sm">Post to Patternfolio</button>
  <button id="downloadCsv" class="btn btn-secondary btn-sm ms-auto">Export CSV</button>
</div>
<!-- Row Indicator -->
<div id="row-indicator"></div>
<!-- Chart above the sheet -->
<div id="chart" class="border mt-4 rounded"></div>
<section class="market-radar">
  <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
    <h4 class="mb-0">Catalyst Radar (Marketaux)</h4>
    <div id="market-radar-updated" class="radar-updated"></div>
  </div>
  <div id="market-radar-cards" class="radar-grid"></div>
  <div id="market-radar-leaders"></div>
  <div id="market-radar-intraday"></div>
</section>
<!-- Editable grid below -->
<div id="sheet"></div>
<div class="d-flex justify-content-between align-items-center mb-2">
  <h4 class="mb-0">News Headlines for the Day</h4>
  <button id="copy-news" class="btn btn-secondary btn-sm">Copy News JSON</button>
</div>
<div id="news-sheet"></div>
<div class="d-flex justify-content-between align-items-center mb-2">
  <h4 class="mb-0">SEC Filings for the Day</h4>
  <button id="copy-filings" class="btn btn-secondary btn-sm">Copy Filings JSON</button>
</div>
<div id="filings-sheet"></div>
<div id="profile-container"></div>
<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
<script>
// Updated to fix table population issues
const patternfolioURL = "{{PATTERNFOLIO_URL}}";
let currentNews = [];
let currentFilings = [];
let listenersAdded = false;
let isCsvUploaded = false; // Flag to track if CSV was uploaded
let marketLeadersTable = null;
let marketIntradayTable = null;

const nyTime = ts =>
  new Date(ts * 1000).toLocaleTimeString(
    'en-US',
    { timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute: '2-digit' }
  );

/* ─── Date picker with current NY date default ───────────── */
const nyFormatter = new Intl.DateTimeFormat('en-CA',{
  timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
const currentNyDate = nyFormatter.format(new Date());
flatpickr('#tradeDate',{dateFormat:'Y-m-d',defaultDate:currentNyDate});
const nyTimeFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: 'America/New_York',
  hour: 'numeric',
  minute: 'numeric',
  hour12: false
});
const NY_TZ = 'America/New_York';
function tzOffsetFor(epochMillis, timeZone = NY_TZ) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  const parts = dtf.formatToParts(new Date(epochMillis));
  const map = {};
  for (const p of parts) map[p.type] = p.value;
  const asUTC = Date.UTC(+map.year, +map.month - 1, +map.day, +map.hour, +map.minute, +map.second);
  return (asUTC - epochMillis) / 60000;
}
function getNyTime(dateStr, h, m) {
  const [Y, M, D] = dateStr.split('-').map(Number);
  const utcGuess = Date.UTC(Y, M - 1, D, h, m, 0);
  const off1 = tzOffsetFor(utcGuess, NY_TZ);
  let epoch = utcGuess - off1 * 60000;
  const off2 = tzOffsetFor(epoch, NY_TZ);
  if (off2 !== off1) epoch = utcGuess - off2 * 60000;
  return new Date(epoch);
}
const nyHMFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: NY_TZ, hour12: false, hour: '2-digit', minute: '2-digit'
});
function nyHourMinute(epochMillis) {
  const parts = nyHMFormatter.formatToParts(new Date(epochMillis));
  let hh = 0, mm = 0;
  for (const p of parts) {
    if (p.type === 'hour') hh = Number(p.value);
    else if (p.type === 'minute') mm = Number(p.value);
  }
  return [hh, mm];
}

// Place a vertical dashed line + label at 09:30 NY on a lightweight-charts chart
function drawRthOpenLine(chart, containerEl, dateStr) {
  let line = containerEl.querySelector('.rth-line');
  let label = containerEl.querySelector('.rth-label');
  if (!line) {
    line = document.createElement('div'); line.className = 'rth-line';
    label = document.createElement('div'); label.className = 'rth-label'; label.textContent = '09:30';
    containerEl.appendChild(line); containerEl.appendChild(label);
  }

  chart.__rthTarget = getNyTime(dateStr, 9, 30).getTime() / 1000;

  if (!chart.__rthHandler) {
    chart.__rthHandler = () => {
      const x = chart.timeScale().timeToCoordinate(chart.__rthTarget);
      if (x == null) {
        line.style.display = 'none';
        label.style.display = 'none';
        return;
      }
      line.style.display = 'block';
      label.style.display = 'block';
      const px = Math.round(x);
      line.style.left = px + 'px';
      label.style.left = px + 'px';
    };
    chart.timeScale().subscribeVisibleTimeRangeChange(chart.__rthHandler);
    window.addEventListener('resize', chart.__rthHandler);
  }
  chart.__rthHandler();
}

function formatSentiment(value) {
  const num = Number(value || 0);
  if (!Number.isFinite(num)) return "0.00";
  return `${num >= 0 ? "+" : ""}${num.toFixed(2)}`;
}

function sentimentBucket(value) {
  const num = Number(value || 0);
  if (num >= 0.15) return "pos";
  if (num <= -0.15) return "neg";
  return "neu";
}

function pulseBucket(value) {
  const num = Number(value || 0);
  if (num >= 70) return "warn";
  if (num >= 40) return "pos";
  return "neu";
}

function etClock(ts) {
  const date = new Date(ts);
  if (Number.isNaN(date.getTime())) return ts || "";
  return date.toLocaleTimeString("en-US", {
    timeZone: "America/New_York",
    hour12: false,
    hour: "2-digit",
    minute: "2-digit"
  });
}

function renderMarketRadarUnavailable(message) {
  document.getElementById("market-radar-updated").textContent = message;
  document.getElementById("market-radar-cards").innerHTML = "";
  if (marketLeadersTable) {
    marketLeadersTable.setData([]);
  }
  if (marketIntradayTable) {
    marketIntradayTable.setData([]);
  }
}

function renderMarketRadar(data) {
  const radar = data?.radar || {};
  const pulse = Number(radar.pulse_score || 0);
  const sent15 = Number(radar.sentiment_15m || 0);
  const sent60 = Number(radar.sentiment_60m || 0);
  const shift = Number(radar.sentiment_shift || 0);
  const docs15 = Number(radar.documents_last_15m || 0);
  const docs60 = Number(radar.documents_last_60m || 0);
  const trendScore = Number(radar.trend_score || 0);
  const bias = String(radar.bias || "NEUTRAL").toUpperCase();
  const biasClass = bias === "LONG" ? "chip-long" : (bias === "SHORT" ? "chip-short" : "chip-neutral");

  const cards = [
    { label: "Pulse Score", value: pulse.toFixed(0), sub: "0-100 urgency", cls: pulseBucket(pulse) },
    { label: "Bias", value: `<span class="${biasClass}">${bias}</span>`, sub: radar.bias_reason || "", cls: bias === "NEUTRAL" ? "neu" : (bias === "LONG" ? "pos" : "neg") },
    { label: "Mentions 15m", value: docs15.toLocaleString(), sub: `60m: ${docs60.toLocaleString()}`, cls: docs15 >= 8 ? "warn" : "neu" },
    { label: "Sentiment 15m", value: formatSentiment(sent15), sub: `60m: ${formatSentiment(sent60)}`, cls: sentimentBucket(sent15) },
    { label: "Sentiment Shift", value: formatSentiment(shift), sub: "15m vs 60m", cls: sentimentBucket(shift) },
    { label: "Trend Score", value: trendScore.toFixed(1), sub: "Marketaux trend", cls: trendScore >= 70 ? "warn" : "neu" }
  ];
  document.getElementById("market-radar-cards").innerHTML = cards.map(card => `
    <div class="radar-card ${card.cls}">
      <div class="label">${card.label}</div>
      <div class="value">${card.value}</div>
      <div class="sub">${card.sub}</div>
    </div>
  `).join("");

  const updatedAt = data?.published_at ? `Updated ${new Date(data.published_at).toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit" })}` : "";
  const warningText = (data?.warnings || []).length ? ` | ${data.warnings[0]}` : "";
  document.getElementById("market-radar-updated").textContent = `${updatedAt}${warningText}`;

  const leaders = (data?.leaders || []).map(item => ({
    symbol: item.symbol || "",
    total_documents: Number(item.total_documents || 0),
    sentiment_avg: Number(item.sentiment_avg || 0),
    score: Number(item.score || 0),
    why: item.why || ""
  }));
  if (!marketLeadersTable) {
    marketLeadersTable = new Tabulator("#market-radar-leaders", {
      data: leaders,
      layout: "fitColumns",
      headerWordWrap: true,
      tooltipsHeader: true,
      tooltips: truncatedTooltip,
      rowClick: (_, row) => {
        const sym = row.getData().symbol;
        if (!sym) return;
        document.getElementById("ticker").value = sym;
        load();
      },
      columns: [
        { title: "MOVERS", field: "symbol", minWidth: 90, headerSort: false, headerTooltip: true },
        { title: "DOCS", field: "total_documents", minWidth: 80, headerSort: false, headerTooltip: true },
        {
          title: "SENT", field: "sentiment_avg", minWidth: 80, headerSort: false, headerTooltip: true,
          formatter: cell => {
            const val = Number(cell.getValue() || 0);
            const cls = sentimentBucket(val) === "pos" ? "chip-long" : (sentimentBucket(val) === "neg" ? "chip-short" : "chip-neutral");
            return `<span class="${cls}">${formatSentiment(val)}</span>`;
          }
        },
        { title: "TREND", field: "score", minWidth: 80, headerSort: false, headerTooltip: true, formatter: cell => Number(cell.getValue() || 0).toFixed(1) },
        { title: "WHY MOVING", field: "why", minWidth: 320, headerSort: false, headerTooltip: true }
      ]
    });
  } else {
    marketLeadersTable.setData(leaders);
  }

  const rawBuckets = (data?.intraday || []).map(item => ({
    date: item.date,
    total_documents: Number(item.total_documents || 0),
    sentiment_avg: Number(item.sentiment_avg || 0)
  })).sort((a, b) => new Date(a.date) - new Date(b.date));
  const intraday = rawBuckets.map((item, idx) => {
    const prev = idx > 0 ? rawBuckets[idx - 1] : null;
    return {
      time: etClock(item.date),
      total_documents: item.total_documents,
      sentiment_avg: item.sentiment_avg,
      sentiment_delta: prev ? (item.sentiment_avg - prev.sentiment_avg) : 0
    };
  }).slice(-24).reverse();
  if (!marketIntradayTable) {
    marketIntradayTable = new Tabulator("#market-radar-intraday", {
      data: intraday,
      layout: "fitColumns",
      headerWordWrap: true,
      tooltipsHeader: true,
      tooltips: truncatedTooltip,
      columns: [
        { title: "LAST MINUTES (ET)", field: "time", minWidth: 120, headerSort: false, headerTooltip: true },
        { title: "DOCS", field: "total_documents", minWidth: 80, headerSort: false, headerTooltip: true },
        {
          title: "SENT", field: "sentiment_avg", minWidth: 80, headerSort: false, headerTooltip: true,
          formatter: cell => formatSentiment(cell.getValue())
        },
        {
          title: "SHIFT", field: "sentiment_delta", minWidth: 80, headerSort: false, headerTooltip: true,
          formatter: cell => formatSentiment(cell.getValue())
        }
      ]
    });
  } else {
    marketIntradayTable.setData(intraday);
  }
}

async function displayMarketRadar(ticker, date) {
  try {
    const { data } = await axios.get("/api/market-stats", { params: { ticker, date } });
    renderMarketRadar(data);
  } catch (err) {
    console.warn("[marketRadar] unavailable", err?.response?.data || err.message);
    renderMarketRadarUnavailable("Market Stats unavailable");
  }
}

/* ─── Chart setup ─────────────────────────────────────────── */
const chart = LightweightCharts.createChart(document.getElementById('chart'),{
  layout:{background:{color:'#121d2d'},textColor:'#d7e4f4'},
  grid:{vertLines:{color:'#2b3a52'},horzLines:{color:'#2b3a52'}},
  timeScale:{timeVisible:true,secondsVisible:false},
  localization:{ timeFormatter: nyTime } // ★ cross‑hair label
});
chart.timeScale().applyOptions({ tickMarkFormatter: nyTime }); // ★ axis ticks

const candleSeries = chart.addCandlestickSeries({
  upColor:'#21c58f',downColor:'#ff8a5a',
  wickUpColor:'#21c58f',wickDownColor:'#ff8a5a',borderVisible:false});
const volumeSeries = chart.addHistogramSeries({
  color:'#67819f',priceFormat:{type:'volume'},
  priceScaleId:'vol',scaleMargins:{top:0.75,bottom:0}});
chart.priceScale('right').applyOptions({scaleMargins:{top:0.05,bottom:0.35}});
chart.priceScale('vol').applyOptions({scaleMargins:{top:0.75,bottom:0}});
const vwapSeries = chart.addLineSeries({color:'#ffd166',lineWidth:2});
const smaSeries = chart.addLineSeries({color:'#5fb3ff',lineWidth:2});

/* ─── Global data storage ────────────────────────────────── */
let cachedCandles = [];
let cachedVolume = [];
let cachedMinCandles = [];
let cachedMinVolume = [];
let priorDayCloses = {}; // Store prior‑day closes
let priorDayVolumes = {}; // New: Store prior-day RTH volumes
let priorDayDates = {};

/* ─── Load candles with debug logging ────────────────────── */
async function load(e, skipDefaultRow = false){
  if(e) e.preventDefault();
  const ticker = document.getElementById('ticker').value.trim();
  const timeframe= document.getElementById('timeframe').value;
  const date = document.getElementById('tradeDate').value;
  console.debug('[load] requesting',{ticker,timeframe,date});
  if(!ticker||!timeframe||!date){alert('Fill all fields');return;}
  try{
    const {data}=await axios.get('/api/candles',{params:{ticker,timeframe,date}});
    console.debug('[load] received',data.candles.length,'bars');
    if(!data.candles.length){
      console.warn('[load] no candles',ticker,date,timeframe);
      alert('No RTH data for this date; try the prior trading day.');
    }
    await fetchPriorDayClose(ticker,date);
    // Determine multMin for aggregation
    let multMin;
    switch(timeframe) {
      case '1m': multMin = 1; break;
      case '2m': multMin = 2; break;
      case '3m': multMin = 3; break;
      case '5m': multMin = 5; break;
      case '10m': multMin = 10; break;
      case '15m': multMin = 15; break;
      case '30m': multMin = 30; break;
      case '1h': multMin = 60; break;
      default: multMin = 1;
    }
    // Extend minCandles and minVolume to 16:00 if necessary
    if (data.minCandles.length > 0) {
      let lastTime = data.minCandles[data.minCandles.length - 1].time;
      let lastClose = data.minCandles[data.minCandles.length - 1].close;
      let nextTime = lastTime + 60;
      const endTime = getNyTime(date, 16, 0).getTime() / 1000;
      while (nextTime < endTime) {
        data.minCandles.push({time: nextTime, open: lastClose, high: lastClose, low: lastClose, close: lastClose});
        data.minVolume.push({time: nextTime, value: 0});
        nextTime += 60;
      }
    } else {
      data.minCandles = [];
      data.minVolume = [];
    }
    // Recompute VWAP
    let cumPV = 0;
    let cumV = 0;
    data.vwap = [];
    for (let i = 0; i < data.minCandles.length; i++) {
      const c = data.minCandles[i];
      const v = data.minVolume[i].value;
      const typ = (c.high + c.low + c.close) / 3;
      cumPV += typ * v;
      cumV += v;
      if (cumV > 0) {
        data.vwap.push({time: c.time, value: cumPV / cumV});
      } else if (data.vwap.length > 0) {
        data.vwap.push({time: c.time, value: data.vwap[data.vwap.length - 1].value});
      }
    }
    // Aggregate to timeframe using extended min data
    const aggCandles = [];
    const aggVolume = [];
    for (let i = 0; i < data.minCandles.length; i += multMin) {
      const end = Math.min(i + multMin, data.minCandles.length);
      const group = data.minCandles.slice(i, end);
      if (group.length === 0) break;
      const o = group[0].open;
      let h = group[0].high;
      let l = group[0].low;
      for (const g of group) {
        if (g.high > h) h = g.high;
        if (g.low < l) l = g.low;
      }
      const c = group[group.length - 1].close;
      let v = 0;
      for (let j = i; j < end; j++) {
        v += data.minVolume[j].value;
      }
      aggCandles.push({time: group[0].time, open: o, high: h, low: l, close: c});
      aggVolume.push({time: group[0].time, value: v});
    }
    data.candles = aggCandles;
    data.volume = aggVolume;
    // Recompute SMA-9
    let sum = 0;
    data.sma = [];
    for (let i = 0; i < data.candles.length; i++) {
      sum += data.candles[i].close;
      if (i >= 9) {
        sum -= data.candles[i - 9].close;
      }
      if (i >= 8) {
        data.sma.push({time: data.candles[i].time, value: sum / 9});
      }
    }
    /* Cache */
    cachedCandles=data.candles;cachedVolume=data.volume;
    cachedMinCandles=data.minCandles;cachedMinVolume=data.minVolume;
    candleSeries.setData(data.candles);
    volumeSeries.setData(data.volume);
    vwapSeries.setData(data.vwap);
    smaSeries.setData(data.sma);
    candleSeries.setMarkers([]);
    chart.timeScale().fitContent();
    drawRthOpenLine(chart, document.getElementById('chart'), date);
    await Promise.all([
      displayExtra(ticker, date),
      displayMarketRadar(ticker, date)
    ]);
    if (csvData.length === 1 && csvData[0].ticker.toUpperCase() !== ticker.toUpperCase() && !isCsvUploaded) {
      csvData = [];
      table.setData([]);
    }
    if (csvData.length === 0 && !skipDefaultRow) {
      if (cachedMinCandles.length === 0) {
        // No candle data available, do not create default row or show chart
        candleSeries.setData([]);
        volumeSeries.setData([]);
        vwapSeries.setData([]);
        smaSeries.setData([]);
        return;
      }
      const row = { ticker: ticker.toUpperCase(), time: '0930', signal: 'buy' };
      NEW_COLUMNS.forEach(col => row[col] = '');
      await calculateMetricsForRow(row);
      csvData = [{__row: 0, ...row}];
      const allFields = ['ticker', 'time', 'signal', ...NEW_COLUMNS];
      const cols = allFields.map(h => ({
        title: h.toUpperCase().replace(/_/g, ' '),
        field: h,
        editor: "input",
        minWidth: 80,
        headerSort: false,
        headerTooltip: true
      }));
      cols.unshift({ title: "#", formatter: "rownum", hozAlign: "center", width: 40, frozen: true });
      table.setColumns(cols);
      table.setData(csvData).then(() => {
        currentRow = 0;
        updateTableView();
        showSignalOnChart(csvData[currentRow]);
      });
    }
  }catch(err){
    console.error('[load] error',err);
    alert('Error: '+(err.response?.data||err));
  }
}

/* ─── Fetch prior‑day close (handles holidays/weekends) ─── */
async function fetchPriorDayClose(ticker,date){
  const key = ticker.toUpperCase(); // *** NEW: normalise once ***
  if(priorDayCloses[key]) return; // cached
  let d = new Date(date);
  d.setDate(d.getDate() - 1);
  const to_date = d.toISOString().split('T')[0];
  d.setDate(d.getDate() - 30);
  const from_date = d.toISOString().split('T')[0];
  console.debug('[priorDay] fetching',key,from_date,to_date);
  try{
    const {data}=await axios.get('/api/candles',
      {params:{ticker: key,timeframe:'1d',from:from_date,to:to_date}});
    if(data.candles&&data.candles.length>0){
      const last=data.candles[data.candles.length-1];
      priorDayCloses[key]=last.close;
      console.debug('[priorDay] close',key,last.close);
      // New: Prior day volume (RTH cumulative)
      const priorVol = data.volume[data.volume.length-1].value;
      priorDayVolumes[key] = priorVol;
      const prior_date = new Date(last.time * 1000).toISOString().split('T')[0];
      priorDayDates[key] = prior_date;
      return;
    }else{console.warn('[priorDay] no candles',from_date,to_date);}
  }catch(err){console.warn('[priorDay] error',err);}
  console.error('[priorDay] could not find close');
}

/* ─── Tooltip only for truncated cell values ──────────────── */
function truncatedTooltip(cell){
  // If cell element exists, and the content is overflowed (truncated), show full value as tooltip
  const el = cell.getElement();
  const textEl = el.querySelector('a') || el;
  if (textEl && (textEl.scrollWidth > textEl.clientWidth || textEl.scrollHeight > textEl.clientHeight)) {
    return cell.getValue();
  }
  return false; // No tooltip unless overflow
}

/* ─── Fetch extended hours data for pre/after market ────── */
async function fetchExtendedData(ticker, date){
  console.debug('[extended] fetching for', ticker, date);
  try {
    const {data} = await axios.get('/api/candles', {
      params: {ticker, timeframe: '1m', date, extended: 'true'}
    });
    return data.minVolume; // Returns all 1m bars (pre, RTH, after)
  } catch (err) {
    console.error('[extended] error', err);
    return [];
  }
}

/* ─── Calculate pre-market volume ────────────────────────── */
async function calculatePreMarketVolume(ticker, currentDate, priorDate){
  const priorExtVol = await fetchExtendedData(ticker, priorDate);
  const priorAfterHours = priorExtVol
    .filter(v => { const [hour] = nyHourMinute(v.time * 1000); return hour >= 16 && hour < 20; })
    .reduce((sum, v) => sum + v.value, 0);
  const currExtVol = await fetchExtendedData(ticker, currentDate);
  const currPreMarket = currExtVol
    .filter(v => { const [hour, min] = nyHourMinute(v.time * 1000); return (hour >= 4 && hour < 9) || (hour === 9 && min < 30); })
    .reduce((sum, v) => sum + v.value, 0);
  return priorAfterHours + currPreMarket;
}

/* ─── Format number with suffixes ────────────────────────── */
function formatNumber(num, isMarketCap = false) {
  if (num < 1000) return (isMarketCap ? '$' : '') + num.toFixed(1);
  if (num < 1000000) return (isMarketCap ? '$' : '') + (num / 1000).toFixed(1) + ' K';
  if (num < 100000000) return (isMarketCap ? '$' : '') + (num / 1000000).toFixed(1) + ' M';
  if (num < 1000000000) return (isMarketCap ? '$' : '') + (num / 1000000).toLocaleString('en-US', {maximumFractionDigits: 1}) + ' M';
  if (num < 100000000000) return (isMarketCap ? '$' : '') + (num / 1000000000).toFixed(1) + ' B';
  return (isMarketCap ? '$' : '') + (num / 1000000000).toLocaleString('en-US', {maximumFractionDigits: 1}) + ' B';
}

/* ─── Fetch and format market cap from Polygon ────────────── */
async function fetchMarketCap(ticker) {
  try {
    const {data} = await axios.get('/api/ticker-details', {params: {ticker}});
    const marketCap = data.results.market_cap || 0;
    return formatNumber(marketCap, true);
  } catch (err) {
    console.error('[marketCap] error for', ticker, err);
    return 'na'; // Fallback
  }
}

/* ─── Fetch and format float from FMP ─────────────────────── */
async function fetchFloat(ticker) {
  try {
    const {data} = await axios.get('/api/share-float', {params: {ticker}});
    const floatShares = data[0]?.floatShares || 0;
    return formatNumber(floatShares);
  } catch (err) {
    console.error('[float] error for', ticker, err);
    return 'na'; // Fallback
  }
}

/* ─── Calculate metrics for a CSV row (async for fetches) ── */
async function calculateMetricsForRow(row){
  if(!cachedMinCandles.length) return;
  const rowTime=row.time;
  if(!rowTime) return;
  const relevant = cachedMinCandles;
  if(relevant.length > 0) {
    const openPrice=relevant[0].open;
    const eodClose=relevant[relevant.length-1].close;
    const highOfDay=Math.max(...relevant.map(c=>c.high));
    const lowOfDay =Math.min(...relevant.map(c=>c.low));
    row.open_price = openPrice.toFixed(2);
    row.close_price = eodClose.toFixed(2);
    row.high_of_day = highOfDay.toFixed(2);
    row.low_of_day = lowOfDay.toFixed(2);
    if(openPrice>0){
      let gain = ((eodClose - openPrice) / openPrice * 100).toFixed(2);
      if (row.signal.toLowerCase() === 'sell') {
        gain = ((openPrice - eodClose) / openPrice * 100).toFixed(2);
      }
      row.percent_gain_eod = gain;
      row.max_spiking_up_percent = ((highOfDay-openPrice)/openPrice*100).toFixed(2);
      row.max_spiking_down_percent = ((openPrice - lowOfDay)/openPrice*100).toFixed(2);
    }
    if(cachedMinVolume.length){
      const relevantVolume = cachedMinVolume;
      const totalVol = relevantVolume.reduce((s, v) => s + v.value, 0);
      row.volume = Math.round(totalVol).toLocaleString();
    }
    const ticker=row.ticker.toUpperCase();
    if(priorDayCloses[ticker]){
      const prior=priorDayCloses[ticker];
      row.percent_gap_from_prior = ((openPrice-prior)/prior*100).toFixed(2);
    }
    // New: Prior day volume (RTH cumulative)
    if(priorDayVolumes[ticker]){
      row.prior_day_volume = Math.round(priorDayVolumes[ticker]).toLocaleString();
    }
    // New: Pre-market volume (prior after + current pre)
    const priorDate = priorDayDates[ticker] || '';
    let preVol = 0;
    if(priorDate){
      const currentDate = document.getElementById('tradeDate').value;
      preVol = await calculatePreMarketVolume(ticker, currentDate, priorDate);
    }
    row.pre_market_volume = Math.round(preVol).toLocaleString();
    // New: Market Cap from Polygon
    row.market_cap = await fetchMarketCap(ticker);
    // New: Float from FMP
    row.float = await fetchFloat(ticker);
  }
}

/* ─── Show signal on chart ───────────────────────────────── */
function combineDateAndTime(dateStr,HHMM){
  const s = String(HHMM).replace(':','').padStart(4,'0');
  const h = parseInt(s.slice(0,2),10), m = parseInt(s.slice(2,4),10);
  return getNyTime(dateStr,h,m).getTime();
}

async function showSignalOnChart(row){
  console.debug('[show] row →',row);
  const currentTicker = document.getElementById('ticker').value.toUpperCase();
  if (row.ticker.toUpperCase() !== currentTicker) {
    document.getElementById('ticker').value = row.ticker.toUpperCase();
    await load(null, true); // Load with skipDefaultRow = true to avoid recursion
  }
  await calculateMetricsForRow(row); // enrich row metrics (async)
  table.updateData([row]); // show updates in grid
  const hhmm = String(row.time).replace(':','').padStart(4,'0');
  const ts = combineDateAndTime(document.getElementById('tradeDate').value, hhmm);
  const isBuy = row.signal.toLowerCase() === "buy";
  if (hhmm === '0930') {
    candleSeries.setMarkers([]);
  } else {
      candleSeries.setMarkers([{
      time:ts/1000,
      position:isBuy?"belowBar":"aboveBar",
      shape:isBuy?"arrowUp":"arrowDown",
      color:isBuy?"#21c58f":"#ff8a5a",
      size:2
    }]);
  }
}
